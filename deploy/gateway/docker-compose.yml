# The gateway bundled with DevAppFactory: one Caddy container that owns ports 80 and 443 and
# serves https://<site>.<DOMAIN> for every file in sites/. Settings come from .env in this
# folder, written by deploy/install-gateway.sh. Manage it with scripts/gateway.sh.
name: ${GATEWAY_PROJECT:-factory-gateway}

services:
  caddy:
    image: caddy:2
    container_name: ${GATEWAY_CONTAINER:-gateway-caddy}
    restart: unless-stopped
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
      - "${GATEWAY_HTTPS_PORT:-443}:443/udp"  # HTTP/3
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env}
      - ACME_EMAIL=${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./snippets:/etc/caddy/snippets:ro
      - ./sites:/etc/caddy/sites:ro
      - ./auth:/etc/caddy/auth:ro
      - caddy_data:/data  # certificates: keep this volume
      - caddy_config:/config
    networks:
      - edge
      - app

volumes:
  caddy_data:
  caddy_config:

networks:
  # Shared with the web container of every app the factory runs.
  edge:
    name: ${FACTORY_EDGE_NETWORK:-factory-edge}
    external: true
  # Shared with the factory's own UI.
  app:
    name: ${FACTORY_APP_NETWORK:-devappfactory-network}
    external: true
